[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "klippertouch"
version = "0.1.0"
description = "PySide6/QML touchscreen UI for Klipper printers"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
dependencies = [
  "PySide6>=6.5",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-qt>=4.4",
  "ruff>=0.4",
  "mypy>=1.8",
  "types-requests>=2.31",
]

[project.scripts]
klippertouch = "klippertouch.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/klippertouch"]
artifacts = ["src/klippertouch/qml/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["klippertouch"]
